name: Dependency audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0

      - run: npm audit --audit-level=high --package-lock-only

  osv-scanner:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      upload-sarif: ${{ github.event_name == 'push' }}
